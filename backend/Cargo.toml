[package]
name = "lampung-report-backend"
version = "1.0.0"
edition = "2021"
authors = ["Ridho Fatahilah Joeda <23311111@teknokrat.ac.id>"]
description = "High-performance Axum REST API for Lampung Report Smart Public Complaint Management System"

[dependencies]
# HTTP Web Framework & Async Runtime
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1.38", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }

# Database & SQL Execution
sqlx = { version = "0.7", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate"
] }

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication, Hashing & Security
jsonwebtoken = "9.3"
argon2 = "0.5"
rand = "0.8"

# Utilities & Types
uuid = { version = "1.9", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
validator = { version = "0.18", features = ["derive"] }

